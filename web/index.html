<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV4 Results</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #e3e6eb;
    --accent: #1f5fd1; --prov: #8a5a00; --prov-bg: #fff3d6; --conf: #1d4fa8; --conf-bg: #e2ecff;
    --off: #11683a; --off-bg: #dcf5e6; --warn: #b3261e; --warn-bg: #fde7e5; --flash: #fff7c2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #98a1ae; --line: #2a3039;
      --accent: #7aa7ff; --prov: #ffcf70; --prov-bg: #3a2e12; --conf: #a9c4ff; --conf-bg: #1c2a47;
      --off: #7ee2a8; --off-bg: #133322; --warn: #ffb4ab; --warn-bg: #45191a; --flash: #3b3616;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  select { min-width: 240px; max-width: 100%; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .6; cursor: progress; }
  label.auto { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .note { font-size: 11px; color: var(--muted); }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    select { min-width: 0; width: 100%; }
    th, td { padding: 9px 8px; font-size: 14px; }
    .badge { font-size: 10px; padding: 3px 6px; }
    .tag { display: block; margin: 4px 0 0; }
    .pos, .rev { display: none; }
    th { font-size: 11px; }
    th, td { padding: 9px 6px; }
    th:first-child, td:first-child { padding-left: 12px; }
  }
  @media (prefers-color-scheme: dark) { button { color: #0b1a33; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; }
  td.time { font-weight: 700; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 3px 8px; border-radius: 999px; }
  .PROVISIONAL { color: var(--prov); background: var(--prov-bg); }
  .CONFIRMED { color: var(--conf); background: var(--conf-bg); }
  .OFFICIAL { color: var(--off); background: var(--off-bg); }
  .tag { font-size: 11px; font-weight: 700; margin-left: 6px; }
  .tag.reopened { color: var(--warn); }
  .tag.changed { color: var(--muted); }
  .revm { display: none; font-size: 11px; color: var(--muted); margin-top: 3px; }
  tr.changed td { animation: flash 2.5s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .empty { padding: 28px 14px; color: var(--muted); text-align: center; }
  .error { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) { .revm { display: block; } .badge { letter-spacing: 0; } th, td { font-size: 13px; padding: 9px 6px; } th { font-size: 11px; } td:nth-child(2), th:nth-child(2) { padding-left: 12px; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>PV4 live results</h1>
      <div class="sub">Results change while a race is adjudicated. Refresh to see the latest.</div>
    </div>
    <div class="controls">
      <select id="event" aria-label="Event"><option value="">Loading events…</option></select>
      <button id="refresh" type="button">Refresh</button>
      <label class="auto"><input id="auto" type="checkbox"> Auto every 5s</label>
    </div>
  </header>

  <div id="error" class="error" role="alert" hidden></div>

  <section class="stats" aria-label="Event statistics">
    <div class="stat"><div class="k">Athletes tracked</div><div class="v" id="s-athletes">–</div></div>
    <div class="stat"><div class="k">Updates accepted</div><div class="v" id="s-accepted">–</div></div>
    <div class="stat"><div class="k">Updates ignored</div><div class="v" id="s-ignored">–</div><div class="note">duplicate or stale</div></div>
    <div class="stat"><div class="k">Updates rejected</div><div class="v" id="s-rejected">–</div><div class="note">all events</div></div>
  </section>

  <section class="panel" aria-label="Results">
    <table>
      <thead>
        <tr><th class="num pos">#</th><th>Bib</th><th class="num">Lane</th><th class="num">Time</th><th>Status</th><th class="num rev">Rev</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </section>

  <div class="meta">
    <span id="updated" aria-live="polite">Not fetched yet</span>
    <span>Ordered by time. Position is by time only, not an official placing.</span>
  </div>
</main>

<script>
(() => {
  'use strict';

  // config.json is written by CDK at deploy time (API URL + key), so nothing is hardcoded here.
  let cfg = null;
  const $ = (id) => document.getElementById(id);
  const sel = $('event'), btn = $('refresh'), auto = $('auto');
  let previous = new Map(); // bib -> last seen result, to highlight changes between fetches
  let previousEvent = null;
  let timer = null;
  let inFlight = false;

  // One GraphQL request per refresh (AppSync bills per request, not per field):
  // the event list, the selected event's results and stats, and the global rejected count.
  const PAGE_QUERY = `query Page($eventId: ID!) {
    events
    results(eventId: $eventId) { bib lane revision status timeMs }
    eventStats(eventId: $eventId) { eventId athletesTracked updatesAccepted updatesIgnored }
    updatesRejected
  }`;
  const EVENTS_QUERY = `query { events updatesRejected }`;
  const STATUS_RANK = { PROVISIONAL: 0, CONFIRMED: 1, OFFICIAL: 2 };

  async function gql(query, variables = {}) {
    const res = await fetch(cfg.graphqlUrl, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': cfg.apiKey },
      body: JSON.stringify({ query, variables }),
      cache: 'no-store',
    });
    if (!res.ok) throw new Error(`GraphQL HTTP ${res.status}`);
    const body = await res.json();
    if (body.errors && body.errors.length) throw new Error(body.errors.map((e) => e.message).join('; '));
    return body.data;
  }

  // Times: 10105 -> "10.105", 105123 -> "1:45.123"
  function fmtTime(ms) {
    const m = Math.floor(ms / 60000);
    const s = ((ms % 60000) / 1000).toFixed(3);
    return m ? `${m}:${s.padStart(6, '0')}` : s;
  }

  // Every value from the feed goes in via textContent. bib comes from an unauthenticated
  // public endpoint, so it must never be treated as HTML.
  function td(text, cls) {
    const el = document.createElement('td');
    el.textContent = text;
    if (cls) el.className = cls;
    return el;
  }

  function showError(msg) {
    const e = $('error');
    e.textContent = msg || '';
    e.hidden = !msg;
  }

  function setNumber(id, v) { $(id).textContent = (v ?? '–').toLocaleString(); }

  function selectedEvent() { return sel.value || null; }

  // Rebuild the dropdown from the latest event list; keep the current choice if it still exists.
  function fillEvents(list, want) {
    const events = [...list].sort();
    sel.replaceChildren();
    if (!events.length) {
      const o = document.createElement('option');
      o.textContent = 'No events yet';
      o.value = '';
      sel.append(o);
      sel.disabled = true;
      return null;
    }
    sel.disabled = false;
    for (const id of events) {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = id;
      sel.append(o);
    }
    sel.value = events.includes(want) ? want : events[0];
    return sel.value;
  }

  function render(eventId, data) {
    const s = data.eventStats;
    setNumber('s-athletes', s.athletesTracked);
    setNumber('s-accepted', s.updatesAccepted);
    setNumber('s-ignored', s.updatesIgnored);
    setNumber('s-rejected', data.updatesRejected);

    const sameEvent = eventId === previousEvent;
    const rows = [...data.results].sort((a, b) => a.timeMs - b.timeMs || a.bib.localeCompare(b.bib));
    const tbody = $('rows');
    tbody.replaceChildren();
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      const before = previous.get(r.bib);
      const changed = sameEvent && (!before || before.revision !== r.revision);
      const reopened = sameEvent && before && STATUS_RANK[r.status] < STATUS_RANK[before.status];
      if (changed) tr.className = 'changed';

      tr.append(td(String(i + 1), 'num pos'), td(r.bib), td(String(r.lane), 'num'), td(fmtTime(r.timeMs), 'num time'));
      const st = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = `badge ${r.status}`;
      badge.textContent = r.status;
      st.append(badge);
      if (reopened) {
        const t = document.createElement('span');
        t.className = 'tag reopened';
        t.textContent = `REOPENED (was ${before.status})`;
        st.append(t);
      } else if (changed && before) {
        const t = document.createElement('span');
        t.className = 'tag changed';
        t.textContent = 'updated';
        st.append(t);
      }
      const revm = document.createElement('span');
      revm.className = 'revm';
      revm.textContent = `rev ${r.revision}`;
      st.append(revm);
      tr.append(st, td(String(r.revision), 'num rev'));
      tbody.append(tr);
    });

    const empty = $('empty');
    empty.hidden = rows.length > 0;
    empty.textContent = 'No results stored for this event yet.';

    previous = new Map(rows.map((r) => [r.bib, r]));
    previousEvent = eventId;
    $('updated').textContent = `Last fetched ${new Date().toLocaleTimeString()} · ${eventId}`;
  }

  async function refresh() {
    if (inFlight) return;
    inFlight = true;
    btn.disabled = true;
    try {
      // Normally ONE request: events + the chosen event's data together.
      // A second request is needed only on first load or if the chosen event disappeared.
      const want = selectedEvent() || decodeURIComponent(location.hash.slice(1)) || null;
      let data = want ? await gql(PAGE_QUERY, { eventId: want }) : await gql(EVENTS_QUERY);
      const eventId = fillEvents(data.events, want);
      if (eventId && eventId !== want) data = await gql(PAGE_QUERY, { eventId });
      if (!eventId) {
        render('', { results: [], eventStats: {}, updatesRejected: data.updatesRejected });
        $('empty').textContent = 'No events have been received yet.';
        $('updated').textContent = `Last fetched ${new Date().toLocaleTimeString()}`;
      } else {
        render(eventId, data);
        history.replaceState(null, '', `#${encodeURIComponent(eventId)}`);
      }
      showError('');
    } catch (err) {
      // Keep the last good data on screen; say clearly that it may be stale.
      showError(`Could not refresh: ${err.message}. Showing the last data received.`);
    } finally {
      inFlight = false;
      btn.disabled = false;
    }
  }

  function setAuto(on) {
    clearInterval(timer);
    timer = on ? setInterval(() => { if (!document.hidden) refresh(); }, 5000) : null;
  }

  btn.addEventListener('click', refresh);
  sel.addEventListener('change', refresh);
  auto.addEventListener('change', () => setAuto(auto.checked));

  (async () => {
    try {
      const r = await fetch('config.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(`config.json HTTP ${r.status}`);
      cfg = await r.json();
    } catch (err) {
      showError(`Could not load configuration: ${err.message}`);
      return;
    }
    refresh();
  })();
})();
</script>
</body>
</html>
